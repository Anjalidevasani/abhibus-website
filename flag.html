<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Flag</title>
    <style>
        .flag{
            width: 300px;
            height: 150px;
            
        }
        .saffron{
            background-color: orangered;
            height: 50px;
            border: 1px solid;
        }
        .white{
            background-color: white;
            height: 50px;
            border: 1px solid;

        }
        .green{
            background-color: green;
            height: 50px;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <div class="flag">
        <div class="saffron"></div>
        <div class="white"></div>
        <div class="green"></div>
    </div>
</body>
</html>
